"al3x/visualizerp" = {"fps" = 24, "cols" = 48, "smoothing" = 0.6, "sensitivity" = 1.0, "gate" = 0.0025}
"blackbartblues/audio-switcher" = {"show_percentage" = true, "refresh_interval_seconds" = 60, "panel_refresh_interval_seconds" = 5}
"yugaaank/better-clock" = {"time_format" = "{:%H:%M}", "date_format" = "{:%d.%m.%Y}", "show_date" = true, "font_size" = 88, "date_font_size" = 18}
"noctalia/wallpaper_depth" = {"auto_generate" = true, "manager_open_near_click" = true, "manager_placement" = "floating", "threshold" = 48}
"noctalia/screen_recorder" = {"audio_bitrate" = 192, "audio_codec" = "aac", "audio_source" = "default_output", "color_range" = "limited", "directory" = "@HOME@/Videos/Recordings", "filename_pattern" = "recording_%Y%m%d_%H%M%S", "frame_rate" = 60, "frame_rate_mode" = "cfr", "replay_enabled" = false, "resolution" = "original", "show_cursor" = false, "video_bitrate_mode" = "qp", "video_codec" = "h264", "video_encoder" = "gpu", "video_qp" = 21, "video_source" = "focused"}
"aabidk20/yt-music" = {"debug_logging" = true}

