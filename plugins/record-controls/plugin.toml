id = "4el1k/record-controls"
name = "Screen Recording"
version = "1.0.0"
plugin_api = 26
author = "Ch3L1k"
license = "MIT"
icon = "video"
description = "A compact recording panel for the official Noctalia screen recorder."
dependencies = ["python", "noctalia", "systemctl", "xdg-open", "gpu-screen-recorder"]

